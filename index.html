<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twindoku: Cold Case</title>
<meta name="description" content="Gioco di logica investigativo: posiziona i sospettati sulla mappa seguendo gli indizi e scopri chi era solo con la vittima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twindoku">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#" id="brand" aria-label="Twindoku: Cold Case">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="26" r="17" fill="#3b3150" stroke="#f6c453" stroke-width="6"/><circle cx="26" cy="26" r="11" fill="#5b4b78"/><path d="M20 20a9 9 0 0 1 9-3" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/><rect x="38" y="36" width="10" height="24" rx="4" transform="rotate(-45 43 48)" fill="#f6c453"/></svg>
      <span>Twindoku <em>Cold Case</em></span>
    </a>
    <nav class="topnav">
      <button type="button" class="btn" id="prevCase" aria-label="Caso precedente">‹</button>
      <button type="button" class="btn primary" id="archiveBtn">📁 <span class="lbl">Archivio casi</span></button>
      <button type="button" class="btn" id="nextCase" aria-label="Caso successivo">›</button>
      <button type="button" class="btn ghost" id="rulesBtn" aria-label="Come si gioca">?<span class="lbl"> Come si gioca</span></button>
      <button type="button" class="btn ghost" id="creditsBtn" aria-label="Titoli di coda">ⓘ</button>
      <button type="button" class="btn ghost" id="fsBtn" aria-label="Schermo intero" hidden>⛶</button>
    </nav>
  </header>

  <main class="layout">
    <section class="dossier" aria-label="Il caso">
      <article class="card story" id="story"></article>
      <div class="card clues-card">
        <div class="card-head">
          <h2>Indizi</h2>
          <label class="switch"><input type="checkbox" id="helpers"> Aiutini</label>
        </div>
        <ul id="clues" class="clues"></ul>
        <p class="rule-note">Regola d'oro: il colpevole è l'<b>unica</b> persona nella stessa stanza della vittima.</p>
      </div>
    </section>

    <section class="stage" aria-label="Mappa">
      <div class="boardbox" id="boardbox">
        <svg class="compass" viewBox="0 0 40 40" aria-label="Nord in alto"><circle cx="20" cy="22" r="13" fill="none" stroke="#b3a7c3" stroke-width="2"/><path d="M20 10l4 12h-8z" fill="#f6c453"/><path d="M20 34l-4-12h8z" fill="#5b4b78"/><text x="20" y="8" text-anchor="middle" font-size="9" font-weight="900" fill="#f6c453" font-family="Nunito,sans-serif">N</text></svg>
        <div id="board" class="board"></div>
      </div>
      <div class="bar">
        <div id="status" class="status" aria-live="polite"></div>
        <div class="tools">
          <div class="seg" role="group" aria-label="Modalità">
            <button type="button" id="modePlace" aria-pressed="true">Metti persona</button>
            <button type="button" id="modeMark" aria-pressed="false">Segna ✕</button>
          </div>
          <button type="button" class="btn" id="undoBtn">↶ Annulla</button>
          <button type="button" class="btn" id="hintBtn">💡 Aiuto</button>
          <button type="button" class="btn warn" id="resetBtn">Ricomincia</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="card tray-card">
        <div class="card-head">
          <h2>Persone</h2>
          <span class="meta">⏱ <b id="timer">0:00</b> · 💡 <b id="hintsUsed">0</b></span>
        </div>
        <div id="tray" class="tray"></div>
      </div>
      <div class="card legend-card" id="legend"></div>
    </aside>
  </main>
</div>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<canvas id="confetti" hidden></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
