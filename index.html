<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twindoku: Cold Case</title>
<meta name="description" content="Gioco di logica investigativo: posiziona i sospettati sulla mappa seguendo gli indizi e scopri chi era solo con la vittima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Patrick+Hand&family=Special+Elite&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8f6a42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twindoku">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#" id="brand" aria-label="Twindoku: Cold Case">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="26" r="17" fill="#fbf8ef" stroke="#2b2118" stroke-width="6"/><circle cx="26" cy="26" r="11" fill="#cfe0f0"/><path d="M20 20a9 9 0 0 1 9-3" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/><rect x="38" y="36" width="10" height="24" rx="4" transform="rotate(-45 43 48)" fill="#d43d3d"/></svg>
      <span>Twindoku <em>Cold Case</em></span>
    </a>
    <nav class="topnav">
      <button type="button" class="btn" id="prevCase" aria-label="Caso precedente">‹</button>
      <button type="button" class="btn primary" id="archiveBtn">📁 <span class="lbl">Archivio casi</span></button>
      <button type="button" class="btn" id="nextCase" aria-label="Caso successivo">›</button>
      <button type="button" class="btn ghost profile-btn" id="profileBtn" aria-label="Scegli il tuo detective"><span class="av">👤</span><span class="lbl">Entra</span></button>
      <button type="button" class="btn ghost" id="rulesBtn" aria-label="Come si gioca">?<span class="lbl"> Come si gioca</span></button>
      <button type="button" class="btn ghost" id="creditsBtn" aria-label="Titoli di coda">ⓘ</button>
      <button type="button" class="btn ghost" id="fsBtn" aria-label="Schermo intero" hidden>⛶</button>
    </nav>
  </header>

  <main class="layout" id="layout" data-view="map">
    <div class="views" role="tablist" aria-label="Schede">
      <button type="button" role="tab" data-view="map" aria-selected="true">🗺 Mappa</button>
      <button type="button" role="tab" data-view="clues" aria-selected="false">📋 Indizi · <b id="viewCount"></b></button>
    </div>
    <section class="dossier" aria-label="Il caso">
      <article class="story" id="story"></article>
      <div class="clues-card">
        <div class="card-head">
          <h2>Indizi</h2>
          <span class="count" id="clueCount"></span>
          <label class="switch"><input type="checkbox" id="helpers"> Aiutini</label>
        </div>
        <ul id="clues" class="clues"></ul>
        <p class="rule-note">Regola d'oro: il colpevole è l'<b>unica</b> persona nella stessa stanza della vittima.</p>
      </div>
    </section>

    <section class="stage" aria-label="Mappa">
      <div class="hud"><div class="pips" id="pips"></div><span id="found"></span><span class="sp"></span><span>⏱ <b id="timer">0:00</b></span><span>💡 <b id="hintsUsed">0</b></span></div>
      <div class="boardbox" id="boardbox"><div class="sheet"><div id="board" class="board"></div></div></div>
      <div class="bar">
        <div id="status" class="status" aria-live="polite"></div>
        <div class="tools">
          <div class="seg" role="group" aria-label="Modalità">
            <button type="button" id="modePlace" aria-pressed="true">Metti<span class="lbl"> persona</span></button>
            <button type="button" id="modeMark" aria-pressed="false">Segna ✕</button>
          </div>
          <button type="button" class="btn" id="undoBtn" aria-label="Annulla l'ultima mossa">↶<span class="lbl"> Annulla</span></button>
          <button type="button" class="btn" id="hintBtn" aria-label="Chiedi un aiuto">💡<span class="lbl"> Aiuto</span></button>
          <button type="button" class="btn warn" id="resetBtn" aria-label="Ricomincia il caso">⟲<span class="lbl"> Ricomincia</span></button>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="tray-card">
        <div class="card-head"><h2>Persone</h2></div>
        <div id="tray" class="tray"></div>
      </div>
      <div class="legend-card" id="legend"></div>
    </aside>
  </main>
</div>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<canvas id="confetti" hidden></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
